<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><title>DAZER Estándar</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font:600 16px/1.3 "Open Sans",system-ui,sans-serif}
#app{max-width:480px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{flex:1;padding:12px;overflow:auto}
h2{margin:6px 0 10px}
.box{border:2px solid #fff;border-radius:6px 16px 8px 14px;margin:12px;padding:14px;text-align:center}
.bar{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:8px 12px;border-bottom:2px solid #fff}
.logo{margin:0;font-size:28px;line-height:1}
.logo b{display:inline-block;width:30px;height:30px;border:2px solid #fff;border-radius:50%;font-size:14px;text-align:center;line-height:26px;margin-left:6px}
.logo small{display:block;font-size:12px;margin-top:2px}
button{background:#000;color:#fff;border:2px solid #fff;border-radius:4px 10px 5px 9px;padding:10px;margin:6px 0;font:inherit;cursor:pointer;width:100%}
button:focus-visible,.in:focus-visible{outline:3px solid #a35bff}
.bar button{width:auto;margin:0;padding:6px 10px}
.in{display:block;width:100%;padding:10px;margin:6px 0;background:#fff;color:#000;border:0;border-radius:4px;font:inherit}
.pp{color:#7a1fd6;background:#fff;font-weight:800}
.ok{background:#0a7a0a}.no{background:#b00}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.card,.card2{background:#eee;color:#000;border-radius:6px;padding:8px;text-align:center;word-break:break-word}
.av{display:block;background:#000;color:#fff;font-style:normal;font-size:40px;padding:14px 0;margin-bottom:6px}
.avi{display:block;width:64px;height:64px;border-radius:50%;object-fit:cover;margin:0 auto 6px}
.card button{font-size:13px}
.card2 video,.card2 img{width:100%;border-radius:4px}
.on{color:#080;display:block}.off{color:#c00;display:block}
nav{display:flex;overflow-x:auto;border-top:2px solid #fff}
nav button{flex:1 0 58px;border:0;font-size:10px;margin:0;padding:8px 2px}
nav span{display:block;font-size:20px}
nav .act{color:#f33}
footer{text-align:center;padding:8px;font:14px Georgia,serif;border-top:2px solid #fff}
.ms{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.b{background:#fff;color:#000;border-radius:12px;padding:8px 12px;margin:0;max-width:80%;align-self:flex-start;word-break:break-word}
.b.yo{align-self:flex-end;background:#d9b8ff}
.env{display:flex;gap:8px;padding:8px}.env button{width:56px;margin:6px 0}
.who{font-size:20px}
.hero{text-align:center;padding-top:60px}.hero h1{font-size:56px;margin:0}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#7a1fd6;padding:10px 16px;border-radius:8px;z-index:9;max-width:90%}
</style></head><body>
<div id="app"></div>
<script type="module">
/* PASOS (solo en el proyecto "cuentas"):
   1) Authentication → Método de acceso → Google → Habilitar (elige tu correo de asistencia).
   2) Authentication → Configuración → Dominios autorizados → agrega donde publiques la página (ej. tuusuario.github.io).
   3) Firestore Database → crear base → Reglas, dentro de "match /databases/{database}/documents { ... }":
      match /usuarios/{u}{allow read:if request.auth!=null;allow write:if request.auth.uid==u;}
      match /chats/{c}/mensajes/{m}{allow read:if request.auth!=null&&request.auth.uid in c.split("__");allow create:if request.auth!=null&&request.auth.uid in c.split("__")&&request.resource.data.de==request.auth.uid;}
      match /contenido/{d}{allow read:if request.auth!=null;allow create:if request.auth!=null&&request.resource.data.uid==request.auth.uid;}
   4) Storage (plan Blaze) → Reglas, dentro de "match /b/{bucket}/o { ... }":
      match /contenido/{u}/{f}{allow read:if request.auth!=null;allow write:if request.auth.uid==u&&request.resource.size<50*1024*1024&&request.resource.contentType.matches("(image|video)/.*");} */
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signOut}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import{getFirestore,collection,doc,setDoc,getDoc,getDocs,addDoc,query,where,orderBy,onSnapshot,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
import{getStorage,ref,uploadBytes,getDownloadURL}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-storage.js";

const app=initializeApp({apiKey:"AIzaSyBthahS-zQDYLPb2nWgksDLEAybhWmKm_4",authDomain:"dazer-extremo-cuentas.firebaseapp.com",projectId:"dazer-extremo-cuentas",storageBucket:"dazer-extremo-cuentas.firebasestorage.app",messagingSenderId:"551686385854",appId:"1:551686385854:web:6bb73a9b34e2471ca26eef"});
const auth=getAuth(app),db=getFirestore(app),st=getStorage(app);
const T=[["sala","⌂","Sala"],["nav","◎","Navegador"],["kurzclips","▣","Kurzclips"],["footage","▷","Footage"],["spielfilm","▭","Spielfilm"],["schnapps","▨","Schnapps"],["com","✉","Comunicación"]];
const N=["NO AL CONTENIDO SIN SENTIDO","NO AL PLAGIO","NO AL SPAM","NO AL CIBERBULLYING","NO AL STALKING","NO A LA PORNOGRAFÍA INFANTIL","NO AL GORE","NO A PERSONAS OBLIGADAS A HACER CONTENIDO"];

const $=s=>document.querySelector(s),A=$("#app");
const uid=()=>auth.currentUser.uid,uref=()=>doc(db,"usuarios",uid());
const esc=s=>String(s).replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
const msg=t=>{const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),3500)};
const logo=s=>`<h1 class="logo">DAZER<b>▲</b><small>${s}</small></h1>`;
const av=u=>u.foto?`<img class="avi" src="${esc(u.foto)}" referrerpolicy="no-referrer" alt="">`:`<i class="av">☺</i>`;
let yo="",ip=null,unsub=null;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();ip=e});
addEventListener("pagehide",()=>{if(auth.currentUser)setDoc(uref(),{estado:"desconectado"},{merge:true}).catch(()=>{})});
const view=h=>{if(unsub){unsub();unsub=null}A.innerHTML=h};
const item=c=>`<div class="card2">${c.tipo=="v"?`<video src="${esc(c.url)}" controls playsinline preload="metadata"></video>`:`<img src="${esc(c.url)}" loading="lazy" alt="">`}<b>${esc(c.titulo)}</b><small>${esc(c.autor)}</small></div>`;

function inicio(){
 view(`<div class="box">${logo("EXTREMO")}<p>Lleva a DAZER a tu pantalla de inicio</p><button id="a">Copiar enlace</button><button id="b">Instalar</button><button id="c">Acceso directo de la página</button><button id="d">Seguir en web</button></div>`);
 $("#a").onclick=()=>navigator.clipboard.writeText(location.href).then(()=>msg("Enlace copiado"));
 $("#b").onclick=()=>ip?ip.prompt():msg("Usa el menú del navegador → Instalar app");
 $("#c").onclick=()=>msg("Menú del navegador → Añadir a pantalla de inicio");
 $("#d").onclick=acceso}

function acceso(){
 view(`<div class="bar"><b>DAZER</b><button id="x">Salir</button></div><main><div class="box">${logo("ESTANDAR")}<p>Entra con tu cuenta de Google (Gmail)</p><button id="g" class="pp">ENTRAR CON GOOGLE</button></div></main>`);
 $("#x").onclick=inicio;
 $("#g").onclick=async()=>{
  const p=new GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});
  try{await signInWithPopup(auth,p);entrada()}
  catch(e){msg({"auth/unauthorized-domain":"Agrega este dominio en Authentication → Configuración → Dominios autorizados","auth/popup-blocked":"Permite las ventanas emergentes para entrar","auth/popup-closed-by-user":"Cerraste la ventana de Google","auth/operation-not-allowed":"Activa Google en Authentication → Método de acceso"}[e.code]||"Error: "+(e.code||e.message))}}}

async function entrada(){
 const u=auth.currentUser,d=await getDoc(uref()),x=d.exists()?d.data():{};
 yo=x.nombre||u.displayName||"Creador";
 await setDoc(uref(),{nombre:yo,foto:u.photoURL||"",estado:"conectado",...(d.exists()?{}:{normas:false,creado:serverTimestamp()})},{merge:true});
 x.normas?casa():normas()}

function normas(){
 view(`<div class="bar">${logo("ESTANDAR")}</div><main><div class="box"><h2>NORMAS DE COMUNIDAD</h2>${N.map(n=>`<p>${n}</p>`).join("")}<button id="si" class="ok">SI ACEPTO LAS NORMAS. SI LAS VIOLO SERÉ BANEADO</button><button id="no" class="no">NO LAS ACEPTO, SALIR</button></div></main>`);
 $("#si").onclick=async()=>{await setDoc(uref(),{normas:true},{merge:true});casa()};
 $("#no").onclick=salir}

async function salir(){
 try{await setDoc(uref(),{estado:"desconectado"},{merge:true})}catch(e){}
 await signOut(auth);inicio()}

function casa(t="sala"){
 view(`<div class="bar">${logo("ESTANDAR")}<button id="x">Salir</button></div><main id="m"></main><nav>${T.map(([k,i,n])=>`<button data-k="${k}" class="${k==t?"act":""}"><span>${i}</span>${n}</button>`).join("")}</nav><footer>DAZER ESTANDAR / VOLUMEN 2</footer>`);
 $("#x").onclick=salir;
 document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>casa(b.dataset.k));
 ({sala,nav:navegador,com:comunicacion}[t]||(()=>galeria(t)))()}

function sala(){$("#m").innerHTML=`<div class="hero"><h1>DAZER</h1><h2>ESTANDAR</h2><p>BIENVENID@ ${esc(yo)}</p></div>`}

function navegador(){
 $("#m").innerHTML=`<input id="q" class="in" placeholder="Busca contenido que gustes"><div id="l" class="grid"></div>`;
 let todo=[];
 const pinta=()=>{const q=$("#q").value.toLowerCase();
  $("#l").innerHTML=todo.filter(c=>c.titulo.toLowerCase().includes(q)).sort((a,b)=>b.creado-a.creado).map(item).join("")||"<p>Sin resultados</p>"};
 $("#q").oninput=pinta;
 getDocs(collection(db,"contenido")).then(s=>{todo=s.docs.map(d=>d.data());pinta()}).catch(()=>msg("No se pudo leer el contenido"))}

async function galeria(t){
 $("#m").innerHTML=`<h2>${t.toUpperCase()}</h2><div class="box"><input id="ti" class="in" placeholder="Título"><input id="fi" class="in" type="file" accept="image/*,video/*"><button id="su" class="pp">SUBIR</button></div><div id="l" class="grid"></div>`;
 $("#su").onclick=async()=>{
  const f=$("#fi").files[0];if(!f)return msg("Elige un archivo");if(f.size>50e6)return msg("Máximo 50 MB");
  try{msg("Subiendo…");
   const r=ref(st,`contenido/${uid()}/${Date.now()}_${f.name.replace(/[^\w.-]/g,"_")}`);await uploadBytes(r,f);
   await addDoc(collection(db,"contenido"),{tab:t,titulo:$("#ti").value.trim()||f.name,url:await getDownloadURL(r),tipo:f.type.startsWith("video")?"v":"i",autor:yo,uid:uid(),creado:Date.now()});
   galeria(t)}catch(e){msg("Error: "+(e.code||e.message))}};
 try{const s=await getDocs(query(collection(db,"contenido"),where("tab","==",t)));
  $("#l").innerHTML=s.docs.map(d=>d.data()).sort((a,b)=>b.creado-a.creado).map(item).join("")||"<p>Aún no hay contenido. Sube el primero.</p>"}
 catch(e){msg("No se pudo leer: "+(e.code||""))}}

async function comunicacion(){
 $("#m").innerHTML=`<h2>COMUNICACIÓN</h2><p>Busca a tus compañeros</p><div id="l" class="grid"></div>`;
 try{const s=await getDocs(collection(db,"usuarios"));
  $("#l").innerHTML=s.docs.filter(d=>d.id!=uid()).map(d=>{const u=d.data(),on=u.estado=="conectado";return`<div class="card">${av(u)}<small class="${on?"on":"off"}">${on?"CONECTADO":"DESCONECTADO"}</small><b>${esc(u.nombre)}</b><button data-i="${d.id}" data-n="${esc(u.nombre)}">COMUNICARTE</button></div>`}).join("")||"<p>Aún no hay más usuarios.</p>";
  document.querySelectorAll("#l button").forEach(b=>b.onclick=()=>chat(b.dataset.i,b.dataset.n))}
 catch(e){msg("No se pudieron leer los usuarios")}}

function chat(otro,nombre){
 const yoId=uid(),col=collection(db,"chats",[yoId,otro].sort().join("__"),"mensajes");
 view(`<div class="bar"><button id="v">←</button><b class="who">☺ ${esc(nombre)}</b></div><div id="ms" class="ms"></div><div class="env"><input id="t" class="in" placeholder="Escribe un mensaje" maxlength="500"><button id="e" class="pp" aria-label="Enviar">➤</button></div>`);
 $("#v").onclick=()=>casa("com");
 unsub=onSnapshot(query(col,orderBy("creado")),s=>{
  $("#ms").innerHTML=s.docs.map(d=>{const m=d.data();return`<p class="b ${m.de==yoId?"yo":""}">${esc(m.texto)}</p>`}).join("");$("#ms").scrollTop=1e9},
  e=>msg("Chat: "+(e.code||"error")));
 const enviar=()=>{const t=$("#t").value.trim();if(!t)return;$("#t").value="";addDoc(col,{de:yoId,texto:t,creado:serverTimestamp()}).catch(e=>msg(e.code))};
 $("#e").onclick=enviar;$("#t").onkeydown=e=>{if(e.key=="Enter")enviar()}}

await auth.authStateReady();
auth.currentUser?entrada():inicio();
</script></body></html>
